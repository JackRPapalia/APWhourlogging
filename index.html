<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APW Hours Log</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c1f24; --muted: #646b75; --border: #dde1e6;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --danger: #c23a3a; --ok: #1d7a46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --text: #e7e9ec; --muted: #9aa1ab; --border: #2e333b;
      --accent: #7f9ef5; --accent-soft: #232c44; --danger: #ef7d7d; --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header nav { display: flex; gap: 4px; margin-left: 8px; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 14px; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  textarea { resize: vertical; min-height: 60px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger { background: transparent; color: var(--danger); border-color: transparent; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .ok { color: var(--ok); }
  .muted { color: var(--muted); }
  .auth { max-width: 380px; margin: 60px auto; }
  .auth .field { margin-bottom: 12px; }
  .auth .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 16px 0; }
  .auth .divider::before, .auth .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .week { border-top: 1px solid var(--border); padding: 16px 0; }
  .week:first-child { border-top: 0; padding-top: 0; }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .week-head strong { font-size: 15px; }
  .week-form { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
  .week-form .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .week-form .status { font-size: 13px; }
  .total { font-variant-numeric: tabular-nums; font-weight: 600; }
  .desc { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar select { width: auto; max-width: 100%; }
  .toolbar label { margin: 0; }
  .grow { flex: 1; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; vertical-align: bottom; }
  th .sub { display: block; font-weight: 400; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.current, td.current { background: var(--accent-soft); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-soft); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; font-weight: 500; }
  .zero { color: var(--muted); }
  .stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .week-editor { display: grid; grid-template-columns: 1fr 160px 160px auto; gap: 12px; align-items: end; margin-top: 16px; }
  .week-editor .btns { display: flex; gap: 6px; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .week-form { grid-template-columns: 1fr; }
    .week-editor { grid-template-columns: 1fr 1fr; }
    .week-editor .label-field, .week-editor .btns { grid-column: 1 / -1; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header id="topbar" class="hidden">
  <h1>APW Hours Log</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="ghost small" id="logout">Log out</button>
</header>

<main id="app"><p class="loading">Loading…</p></main>

<template id="tpl-auth">
  <div class="card auth">
    <h2>APW Hours Log</h2>
    <div class="tabs">
      <button class="ghost small active" data-mode="login">Log in</button>
      <button class="ghost small" data-mode="signup">Create account</button>
    </div>
    <form id="auth-form">
      <div class="field signup-only hidden"><label for="a-name">Full name</label><input id="a-name" autocomplete="name"></div>
      <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" required></div>
      <button type="submit" style="width:100%">Log in</button>
      <div class="login-only" style="margin-top:10px"><button type="button" class="link" id="forgot">Forgot password?</button></div>
      <div class="error" id="auth-error"></div>
    </form>
    <div class="divider">or</div>
    <button type="button" class="ghost" id="google" style="width:100%">Continue with Google</button>
  </div>
</template>

<template id="tpl-student">
  <div class="card">
    <div class="stat-row" id="my-stats" style="margin:0"></div>
  </div>
  <div class="card">
    <h2>My weekly hours</h2>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">Enter your total hours for each week and what you worked on. You can update a week any time.</p>
    <div id="my-weeks"></div>
  </div>
</template>

<template id="tpl-admin">
  <div class="card">
    <h2>Class overview</h2>
    <div class="toolbar">
      <label for="wk-select">Week</label>
      <select id="wk-select"></select>
      <span class="grow"></span>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="name">Name</option>
        <option value="week">Hours in selected week</option>
        <option value="total">Total hours</option>
      </select>
      <button class="ghost small" id="export">Export CSV</button>
    </div>
    <div class="stat-row" id="class-stats"></div>
    <div class="table-wrap"><table id="overview"></table></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Click a student to see what they wrote for each week.</p>
  </div>
  <div class="card hidden" id="detail">
    <div class="week-head">
      <h2 id="detail-title" style="margin:0"></h2>
      <button class="ghost small" id="detail-close">Close</button>
    </div>
    <div class="toolbar" id="detail-actions"></div>
    <div id="detail-weeks"></div>
  </div>
  <div class="card">
    <h2>Weeks</h2>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">Set the date range for each week. Students can log hours for a week once its start date arrives.</p>
    <div class="table-wrap"><table id="weeks-table"></table></div>
    <form id="week-editor" class="week-editor">
      <div class="label-field"><label for="w-label">Label (optional)</label><input id="w-label" maxlength="60" placeholder="e.g. Week 5 or Project sprint"></div>
      <div><label for="w-start">Start date</label><input id="w-start" type="date" required></div>
      <div><label for="w-end">End date</label><input id="w-end" type="date" required></div>
      <div class="btns"><button type="submit" id="w-submit">Add week</button><button type="button" class="ghost hidden" id="w-cancel">Cancel</button></div>
    </form>
    <div class="error" id="week-error"></div>
  </div>
</template>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updateProfile, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, signOut,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, SCRIPT_URL } from "./config.js";

const $ = (sel, root = document) => root.querySelector(sel);
const app = $("#app");
let me = null;
let view = "student";
let pendingName = ""; // full name typed at sign-up, sent with the first request

if (firebaseConfig.apiKey.startsWith("PASTE")) {
  app.innerHTML = `<div class="card auth"><h2>Almost there</h2><p class="muted">Paste your Firebase web config into <code>config.js</code> to turn on login. See the README for the steps.</p></div>`;
  throw new Error("Firebase config missing");
}
const auth = getAuth(initializeApp(firebaseConfig));

// ---------- helpers ----------
// Calls the Apps Script backend with the signed-in user's Firebase ID token.
// The body is sent as text/plain so the browser doesn't need a CORS preflight.
async function api(action, data = {}) {
  const user = auth.currentUser;
  if (!user) throw new Error("Please log in");
  const idToken = await user.getIdToken();
  let out;
  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ ...data, action, idToken }) });
    out = await res.json();
  } catch {
    throw new Error("Couldn't reach the server. Check your connection and try again.");
  }
  if (out.error) throw new Error(out.error);
  return out;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDay(d); };
const today = () => isoDay(new Date());
const fmt = (s, opts) => parseDay(s).toLocaleDateString(undefined, opts);
const short = s => fmt(s, { month: "short", day: "numeric" });
const range = w => `${short(w.start)} – ${fmt(w.end, { month: "short", day: "numeric", year: "numeric" })}`;
const weekName = w => w.label || `Week of ${short(w.start)}`;
const hrs = n => (Math.round(n * 100) / 100).toString();
const stat = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const started = w => w.start <= today();
const isCurrent = w => w.start <= today() && today() <= w.end;
// The week happening now, or else the most recent one that has started, or else the first.
const defaultWeek = weeks => (weeks.find(isCurrent) || weeks.filter(started).at(-1) || weeks[0])?.id;
const loading = () => { app.innerHTML = `<p class="loading">Loading…</p>`; };
const fatal = msg => { app.innerHTML = `<div class="card"><p class="error" style="margin:0">${esc(msg)}</p></div>`; };

// Runs fn while a button shows a busy label, so slow sheet calls don't look frozen.
async function busy(button, label, fn) {
  const old = button.textContent;
  button.disabled = true;
  button.textContent = label;
  try { return await fn(); } finally { button.disabled = false; button.textContent = old; }
}

function authMessage(ex) {
  const messages = {
    "auth/invalid-credential": "Wrong email or password",
    "auth/wrong-password": "Wrong email or password",
    "auth/user-not-found": "Wrong email or password",
    "auth/invalid-email": "Enter a valid email address",
    "auth/missing-password": "Enter your password",
    "auth/email-already-in-use": "An account with that email already exists. Try logging in.",
    "auth/weak-password": "Password must be at least 6 characters",
    "auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
    "auth/popup-closed-by-user": "",
    "auth/cancelled-popup-request": "",
    "auth/operation-not-allowed": "That sign-in method isn't turned on in Firebase yet.",
    "auth/unauthorized-domain": "This website isn't on Firebase's list of authorized domains yet.",
  };
  return ex.code in messages ? messages[ex.code] : ex.message;
}

// ---------- top-level ----------
function render(data) {
  $("#topbar").classList.toggle("hidden", !me);
  if (!me) return renderAuth();
  $("#who").textContent = `${me.name} (${me.email})`;
  const nav = $("#nav");
  nav.innerHTML = me.is_admin
    ? `<button class="ghost small ${view === "student" ? "active" : ""}" data-view="student">My hours</button>
       <button class="ghost small ${view === "admin" ? "active" : ""}" data-view="admin">Admin panel</button>`
    : "";
  nav.onclick = e => { const v = e.target.dataset.view; if (v) { view = v; render(); } };
  const page = view === "admin" && me.is_admin ? renderAdmin() : renderStudent(data);
  page.catch(ex => fatal(ex.message));
}

$("#logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (!user) { me = null; view = "student"; return render(); }
  loading();
  try {
    const data = await api("me", { name: pendingName || user.displayName || "" });
    pendingName = "";
    me = data.user;
    view = me.is_admin ? "admin" : "student";
    render(data);
  } catch (ex) {
    fatal(ex.message);
  }
});

// ---------- auth ----------
function renderAuth() {
  app.replaceChildren($("#tpl-auth").content.cloneNode(true));
  let mode = "login";
  const form = $("#auth-form"), err = $("#auth-error"), submit = form.querySelector("button[type=submit]");
  app.querySelectorAll("[data-mode]").forEach(btn => btn.onclick = () => {
    mode = btn.dataset.mode;
    app.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
    $(".signup-only").classList.toggle("hidden", mode !== "signup");
    $(".login-only").classList.toggle("hidden", mode !== "login");
    $("#a-name").required = mode === "signup";
    $("#a-pass").autocomplete = mode === "signup" ? "new-password" : "current-password";
    submit.textContent = mode === "signup" ? "Create account" : "Log in";
    err.textContent = "";
  });
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = "";
    const email = $("#a-email").value.trim(), password = $("#a-pass").value;
    try {
      await busy(submit, mode === "signup" ? "Creating account…" : "Logging in…", async () => {
        if (mode === "signup") {
          pendingName = $("#a-name").value.trim();
          const { user } = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(user, { displayName: pendingName });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      });
    } catch (ex) { err.textContent = authMessage(ex); }
  };
  $("#forgot").onclick = async () => {
    const email = $("#a-email").value.trim();
    err.className = "error";
    if (!email) { err.textContent = "Enter your email above, then click Forgot password."; return; }
    try {
      await sendPasswordResetEmail(auth, email);
      err.className = "error ok";
      err.textContent = `If there's an account for ${email}, a reset link is on its way.`;
    } catch (ex) { err.textContent = authMessage(ex); }
  };
  $("#google").onclick = async () => {
    err.textContent = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (ex) { err.textContent = authMessage(ex); }
  };
}

// ---------- student ----------
async function renderStudent(data) {
  if (!data) { loading(); data = await api("me"); }
  app.replaceChildren($("#tpl-student").content.cloneNode(true));
  const { weeks } = data;
  let { entries } = data;
  const open = weeks.filter(started).reverse();

  const cur = weeks.find(isCurrent);
  const total = Object.values(entries).reduce((s, e) => s + e.hours, 0);
  $("#my-stats").innerHTML =
    stat(cur ? hrs(entries[cur.id]?.hours || 0) : "–", cur ? `Hours this week (${esc(weekName(cur))})` : "No week in progress") +
    stat(hrs(total), "Total hours") +
    stat(`${Object.keys(entries).length}/${open.length}`, "Weeks logged");

  const list = $("#my-weeks");
  if (!open.length) {
    list.innerHTML = `<p class="muted">${weeks.length ? `The first week starts ${range(weeks[0])}.` : "Your teacher hasn't set up any weeks yet."}</p>`;
    return;
  }
  list.innerHTML = open.map(w => {
    const e = entries[w.id];
    return `
    <form class="week" data-week="${w.id}">
      <div class="week-head">
        <strong>${esc(weekName(w))}${isCurrent(w) ? '<span class="badge">this week</span>' : ""}</strong>
        <span class="muted" style="font-size:13px">${range(w)}</span>
      </div>
      <div class="week-form">
        <div><label for="h-${w.id}">Total hours</label><input id="h-${w.id}" name="hours" type="number" min="0.25" max="100" step="0.25" value="${e ? e.hours : ""}" required></div>
        <div><label for="d-${w.id}">What did you work on?</label><textarea id="d-${w.id}" name="description" maxlength="2000" rows="2" required>${e ? esc(e.description) : ""}</textarea></div>
        <div class="actions">
          <button type="submit" class="small">${e ? "Update" : "Save"}</button>
          ${e ? `<button type="button" class="danger small" data-clear>Clear</button>` : ""}
          <span class="status ${e ? "ok" : "muted"}">${e ? "Saved" : "Not logged yet"}</span>
        </div>
      </div>
    </form>`;
  }).join("");

  const reload = async result => { await renderStudent({ weeks, entries: result.entries }); };
  list.onsubmit = async ev => {
    ev.preventDefault();
    const form = ev.target, status = $(".status", form);
    try {
      const result = await busy(form.querySelector("button[type=submit]"), "Saving…", () =>
        api("saveEntry", { week_id: Number(form.dataset.week), hours: form.hours.value, description: form.description.value }));
      await reload(result);
    } catch (ex) { status.className = "status error"; status.style.margin = 0; status.textContent = ex.message; }
  };
  list.onclick = async ev => {
    if (!ev.target.matches("[data-clear]")) return;
    const form = ev.target.closest("form");
    if (!confirm("Clear your hours for this week?")) return;
    try {
      await reload(await busy(ev.target, "Clearing…", () => api("deleteEntry", { week_id: Number(form.dataset.week) })));
    } catch (ex) { $(".status", form).textContent = ex.message; }
  };
}

// ---------- admin ----------
let adminWeek = null;
let adminSort = "name";

async function renderAdmin() {
  loading();
  const { weeks, students } = await api("overview");
  app.replaceChildren($("#tpl-admin").content.cloneNode(true));
  if (!weeks.some(w => w.id === adminWeek)) adminWeek = defaultWeek(weeks);
  $("#sort").value = adminSort;

  function draw() {
    const sel = $("#wk-select");
    sel.innerHTML = weeks.length
      ? weeks.map(w => `<option value="${w.id}" ${w.id === adminWeek ? "selected" : ""}>${esc(weekName(w))} (${range(w)})</option>`).join("")
      : `<option>No weeks set up yet</option>`;
    sel.disabled = !weeks.length;

    const wkHours = s => s.hours[adminWeek] || 0;
    const sorted = [...students].sort((a, b) =>
      adminSort === "week" ? wkHours(b) - wkHours(a) :
      adminSort === "total" ? b.total - a.total :
      a.name.localeCompare(b.name));
    const learners = students.filter(s => !s.is_admin);
    const logged = learners.filter(s => wkHours(s) > 0).length;
    const weekTotal = learners.reduce((t, s) => t + wkHours(s), 0);
    $("#class-stats").innerHTML =
      stat(learners.length, "Students") +
      stat(`${logged}/${learners.length}`, "Logged this week") +
      stat(hrs(weekTotal), "Class hours this week") +
      stat(logged ? hrs(weekTotal / logged) : "0", "Average per student who logged");

    $("#overview").innerHTML = `
      <thead><tr><th>Student</th>
        ${weeks.map(w => `<th class="num ${w.id === adminWeek ? "current" : ""}">${esc(w.label || short(w.start))}${w.label ? `<span class="sub">${short(w.start)}</span>` : ""}</th>`).join("")}
        <th class="num">Total</th></tr></thead>
      <tbody>${sorted.map(s => `
        <tr class="clickable" data-user="${esc(s.email)}">
          <td>${esc(s.name)} <span class="muted">${esc(s.email)}</span>${s.is_admin ? '<span class="badge">admin</span>' : ""}</td>
          ${weeks.map(w => { const v = s.hours[w.id] || 0; return `<td class="num ${w.id === adminWeek ? "current" : ""} ${v ? "" : "zero"}">${v ? hrs(v) : "–"}</td>`; }).join("")}
          <td class="num"><strong>${hrs(s.total)}</strong></td>
        </tr>`).join("") || `<tr><td colspan="${weeks.length + 2}" class="muted">No accounts yet.</td></tr>`}
      </tbody>`;
  }

  $("#wk-select").onchange = e => { adminWeek = Number(e.target.value); draw(); };
  $("#sort").onchange = e => { adminSort = e.target.value; draw(); };
  $("#overview").onclick = e => { const tr = e.target.closest("tr[data-user]"); if (tr) showStudent(tr.dataset.user).catch(ex => alert(ex.message)); };
  $("#detail-close").onclick = () => $("#detail").classList.add("hidden");
  $("#export").onclick = () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [["Name", "Email", ...weeks.map(w => `${weekName(w)} (${w.start} to ${w.end})`), "Total"].map(q).join(",")];
    for (const s of students.filter(s => !s.is_admin)) lines.push([s.name, s.email, ...weeks.map(w => s.hours[w.id] || 0), s.total].map(q).join(","));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = `apw-hours-${today()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  draw();
  setupWeekEditor(weeks);
}

function setupWeekEditor(weeks) {
  const form = $("#week-editor"), err = $("#week-error");
  let editing = null;

  $("#weeks-table").innerHTML = weeks.length ? `
    <thead><tr><th>Week</th><th>Start</th><th>End</th><th></th></tr></thead>
    <tbody>${[...weeks].reverse().map(w => `
      <tr>
        <td>${esc(weekName(w))}${isCurrent(w) ? '<span class="badge">current</span>' : ""}</td>
        <td>${fmt(w.start, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</td>
        <td>${fmt(w.end, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</td>
        <td class="num"><button class="ghost small" data-edit="${w.id}">Edit</button> <button class="danger small" data-delete="${w.id}">Delete</button></td>
      </tr>`).join("")}
    </tbody>` : `<tbody><tr><td class="muted">No weeks yet. Add the first one below.</td></tr></tbody>`;

  function reset() {
    editing = null;
    const last = weeks.at(-1);
    const start = last ? addDays(last.end, 1) : today();
    $("#w-label").value = "";
    $("#w-start").value = start;
    $("#w-end").value = addDays(start, 6);
    $("#w-submit").textContent = "Add week";
    $("#w-cancel").classList.add("hidden");
    err.textContent = "";
  }
  reset();

  $("#w-start").onchange = () => { if (!editing && $("#w-start").value) $("#w-end").value = addDays($("#w-start").value, 6); };
  $("#w-cancel").onclick = reset;
  $("#weeks-table").onclick = async e => {
    const editId = Number(e.target.dataset.edit), delId = Number(e.target.dataset.delete);
    if (editId) {
      editing = weeks.find(w => w.id === editId);
      $("#w-label").value = editing.label;
      $("#w-start").value = editing.start;
      $("#w-end").value = editing.end;
      $("#w-submit").textContent = "Save changes";
      $("#w-cancel").classList.remove("hidden");
      $("#w-label").focus();
    }
    if (delId) {
      const w = weeks.find(w => w.id === delId);
      if (!confirm(`Delete ${weekName(w)}? Hours students logged for it stay in the sheet but won't show here.`)) return;
      try {
        await busy(e.target, "Deleting…", () => api("deleteWeek", { id: delId }));
        renderAdmin().catch(ex => fatal(ex.message));
      } catch (ex) { err.textContent = ex.message; }
    }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = "";
    const body = { id: editing?.id, label: $("#w-label").value, start: $("#w-start").value, end: $("#w-end").value };
    try {
      await busy($("#w-submit"), "Saving…", () => api("saveWeek", body));
      renderAdmin().catch(ex => fatal(ex.message));
    } catch (ex) { err.textContent = ex.message; }
  };
}

async function showStudent(email) {
  const panel = $("#detail");
  panel.classList.remove("hidden");
  $("#detail-title").textContent = "Loading…";
  $("#detail-actions").innerHTML = "";
  $("#detail-weeks").innerHTML = "";
  const { user, weeks, entries } = await api("userEntries", { email });
  $("#detail-title").textContent = `${user.name} — ${hrs(Object.values(entries).reduce((s, e) => s + e.hours, 0))} h total`;
  if (user.email !== me.email) {
    $("#detail-actions").innerHTML = `
      <button class="ghost small" id="toggle-admin">${user.is_admin ? "Remove admin" : "Make admin"}</button>
      <span class="muted" id="detail-msg" style="font-size:13px"></span>`;
    $("#toggle-admin").onclick = async e => {
      if (!confirm(`${user.is_admin ? "Remove admin access from" : "Give admin access to"} ${user.name}?`)) return;
      try {
        await busy(e.target, "Saving…", () => api("setRole", { email: user.email, is_admin: !user.is_admin }));
        await renderAdmin();
        await showStudent(email);
      } catch (ex) { $("#detail-msg").textContent = ex.message; }
    };
  }
  const shown = weeks.filter(started).reverse();
  $("#detail-weeks").innerHTML = shown.map(w => {
    const e = entries[w.id];
    return `
      <div class="week">
        <div class="week-head">
          <strong>${esc(weekName(w))} <span class="muted" style="font-weight:400;font-size:13px">${range(w)}</span></strong>
          <span class="total">${e ? `${hrs(e.hours)} h` : '<span class="muted">not logged</span>'}</span>
        </div>
        ${e ? `<div class="desc">${esc(e.description)}</div>` : ""}
      </div>`;
  }).join("") || `<p class="muted">No weeks have started yet.</p>`;
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
