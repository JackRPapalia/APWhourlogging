<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APW Hours Log</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c1f24; --muted: #646b75; --border: #dde1e6;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --danger: #c23a3a; --ok: #1d7a46;
    --chart: #2f5bd3; /* bar color, checked with the dataviz palette validator */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --text: #e7e9ec; --muted: #9aa1ab; --border: #2e333b;
      --accent: #7f9ef5; --accent-soft: #232c44; --danger: #ef7d7d; --ok: #6fcf97;
      --chart: #6b8cef; /* the dark accent is too light for chart marks */
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header nav { display: flex; gap: 4px; margin-left: 8px; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 14px; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  textarea { resize: vertical; min-height: 60px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  a.button { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; border: 1px solid var(--accent); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.ghost.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger { background: transparent; color: var(--danger); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .ok { color: var(--ok); }
  .muted { color: var(--muted); }
  .auth { max-width: 380px; margin: 60px auto; }
  .week { border-top: 1px solid var(--border); padding: 16px 0; }
  .week:first-child { border-top: 0; padding-top: 0; }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .week-head strong { font-size: 15px; }
  .week-form { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .hm { display: flex; align-items: center; gap: 6px; }
  .hm input { width: 72px; }
  .hm span { color: var(--muted); font-size: 13px; }
  .week-form .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .week-form .status { font-size: 13px; }
  .total { font-variant-numeric: tabular-nums; font-weight: 600; }
  .desc { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar select { width: auto; max-width: 100%; }
  .toolbar label { margin: 0; }
  .grow { flex: 1; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; vertical-align: bottom; }
  th .sub { display: block; font-weight: 400; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.current, td.current { background: var(--accent-soft); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-soft); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; font-weight: 500; }
  .badge.warn { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .zero { color: var(--muted); }
  .stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .week-editor { display: grid; grid-template-columns: 1fr 160px 160px auto; gap: 12px; align-items: end; margin-top: 16px; }
  .week-editor .btns { display: flex; gap: 6px; }
  .roster-form { display: grid; grid-template-columns: 1fr 160px auto; gap: 12px; align-items: end; }
  .roster-lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
  .roster-lists h3 { font-size: 14px; margin: 0 0 6px; }
  .roster-lists ul { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .roster-lists li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .roster-lists li span { overflow: hidden; text-overflow: ellipsis; }
  /* Keep the credits at the bottom of the window even when the page is short. */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; width: 100%; }
  .credits { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 24px; }
  .chart { width: 100%; min-height: 40px; margin-bottom: 8px; }
  .chart svg { display: block; overflow: visible; }
  .chart .bar { fill: var(--chart); }
  .chart .bar.dim { opacity: .45; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:hover + .bar, .chart .hit:focus + .bar { opacity: 1; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font-size: 11px; }
  .chart .value { fill: var(--text); font-size: 11px; font-weight: 600; }
  .chart-title { font-size: 13px; font-weight: 600; margin: 4px 0 6px; }
  .missing { border-top: 1px solid var(--border); padding-top: 12px; margin: 8px 0 14px; font-size: 14px; }
  .missing .who { color: var(--muted); margin: 4px 0 8px; word-break: break-word; }
  .closed-entry { display: grid; grid-template-columns: 120px 1fr; gap: 12px; font-size: 14px; }
  .late { color: var(--danger); }
  .detail-edit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; margin-top: 8px; }
  .check { display: flex; gap: 8px; align-items: center; grid-column: 1 / -1; font-size: 14px; color: var(--text); margin: 0; }
  .check input { width: auto; }
  .bulk { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .bulk summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .bulk-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .bulk td input[type=checkbox] { width: auto; }
  th .sub.noclass, .noclass-cell { color: var(--muted); font-style: italic; }
  .excused { color: var(--muted); font-style: italic; }
  .banner { max-width: 980px; margin: 16px auto 0; padding: 12px 16px; border: 1px solid var(--danger); border-radius: 10px; background: var(--card); font-size: 14px; width: calc(100% - 32px); }
  .banner strong { color: var(--danger); }
  .banner a, .card a:not(.button) { color: var(--accent); }
  .banner ol { margin: 6px 0 0; padding-left: 20px; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .week-form { grid-template-columns: 1fr; }
    .week-editor { grid-template-columns: 1fr 1fr; }
    .week-editor .label-field, .week-editor .btns { grid-column: 1 / -1; }
    .roster-form, .roster-lists, .closed-entry, .detail-edit { grid-template-columns: 1fr; }
    .bulk-form { grid-template-columns: 1fr 1fr; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header id="topbar" class="hidden">
  <h1>APW Hours Log</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <span class="muted hidden" id="sync" style="font-size:13px">Updating…</span>
  <span class="who" id="who"></span>
  <button class="ghost small" id="logout">Log out</button>
</header>

<div class="banner hidden" id="script-warning" role="status"></div>

<main id="app"><p class="loading">Loading…</p></main>

<footer class="credits">Created by Jack Papalia ’27, data sourcing inspired by Leyna Director ’27</footer>

<template id="tpl-auth">
  <div class="card auth">
    <h2>APW Hours Log</h2>
    <p class="muted" style="font-size:14px;margin:-6px 0 18px">Sign in with your Google account to log your hours.</p>
    <button type="button" id="google" style="width:100%">Sign in with Google</button>
    <p style="text-align:center;margin:10px 0 0"><button type="button" class="ghost small" id="google-other" style="border:0;color:var(--muted)">Not a @trevor.org account? Use another Google account</button></p>
    <div class="error" id="auth-error"></div>
  </div>
</template>

<template id="tpl-student">
  <div class="card">
    <div class="stat-row" id="my-stats" style="margin:0"></div>
  </div>
  <div class="card">
    <h2>Your hours per week</h2>
    <div class="chart" id="my-chart"></div>
  </div>
  <div class="card">
    <h2>My weekly hours</h2>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">Enter your total hours for each week and what you worked on. You can change a week until its due date.</p>
    <div id="my-weeks"></div>
  </div>
</template>

<template id="tpl-admin">
  <div class="card">
    <h2>Class overview</h2>
    <div class="toolbar">
      <label for="wk-select">Week</label>
      <select id="wk-select"></select>
      <label for="section">Section</label>
      <select id="section"></select>
      <span class="grow"></span>
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="name">Name</option>
        <option value="week">Hours in selected week</option>
        <option value="total">Total hours</option>
        <option value="login">Last sign-in</option>
      </select>
      <button class="ghost small" id="export">Export CSV</button>
      <button class="small" id="add-people">Add people</button>
    </div>
    <div class="stat-row" id="class-stats"></div>
    <h3 class="chart-title">Class hours per week <span class="muted" id="chart-scope"></span></h3>
    <div class="chart" id="class-chart"></div>
    <div class="missing" id="missing"></div>
    <div class="table-wrap"><table id="overview"></table></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Click a student to see what they wrote for each week, or to correct it. <span class="late">•</span> logged after the week ended.</p>
  </div>
  <div class="card hidden" id="detail">
    <div class="week-head">
      <h2 id="detail-title" style="margin:0"></h2>
      <button class="ghost small" id="detail-close">Close</button>
    </div>
    <div class="toolbar" id="detail-actions"></div>
    <div id="detail-weeks"></div>
  </div>
  <div class="card" id="class-list">
    <h2>Class list</h2>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">Only people on this list can sign in. Adding a student to a section moves them out of the other one.</p>
    <form id="roster-form" class="roster-form">
      <div><label for="r-emails">Emails (one per line, or separated by commas)</label><textarea id="r-emails" rows="3" required placeholder="ab1234@trevor.org"></textarea></div>
      <div><label for="r-group">Add to</label><select id="r-group"></select></div>
      <div><button type="submit" id="r-submit">Add</button></div>
    </form>
    <div class="error" id="roster-msg"></div>
    <div class="roster-lists" id="roster-lists"></div>
  </div>
  <div class="card">
    <h2>Weeks</h2>
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">Set the date range for each week. Students can log hours for a week once its start date arrives.</p>
    <div class="toolbar hidden" id="deadline-row">
      <label for="grace">Students can change a week until</label>
      <select id="grace">
        <option value="none">any time (no deadline)</option>
        <option value="0">the day it ends</option>
        <option value="1">1 day after it ends</option>
        <option value="2">2 days after it ends</option>
        <option value="3">3 days after it ends</option>
        <option value="7">a week after it ends</option>
      </select>
      <span class="muted" id="deadline-msg" style="font-size:13px"></span>
    </div>
    <div class="table-wrap"><table id="weeks-table"></table></div>
    <form id="week-editor" class="week-editor">
      <div class="label-field"><label for="w-label">Label (optional)</label><input id="w-label" maxlength="60" placeholder="e.g. Week 5 or Project sprint"></div>
      <div><label for="w-start">Start date</label><input id="w-start" type="date" required></div>
      <div><label for="w-end">End date</label><input id="w-end" type="date" required></div>
      <div class="btns"><button type="submit" id="w-submit">Add week</button><button type="button" class="ghost hidden" id="w-cancel">Cancel</button></div>
      <label class="check"><input type="checkbox" id="w-noclass"> No class this week (e.g. a break). Students won't be asked to log hours.</label>
    </form>
    <div class="error" id="week-error"></div>
    <details class="bulk" id="bulk">
      <summary>Set up several weeks at once</summary>
      <div class="bulk-form">
        <div><label for="b-start">First day</label><input id="b-start" type="date"></div>
        <div><label for="b-count">Number of weeks</label><input id="b-count" type="number" min="1" max="60" value="10"></div>
        <div><label for="b-len">Each week lasts</label><select id="b-len"><option value="7">7 days</option><option value="5">5 days (weekdays)</option><option value="14">14 days</option></select></div>
        <div><label for="b-num">Number from</label><input id="b-num" type="number" min="1" max="999" value="1"></div>
      </div>
      <p class="muted" style="font-size:13px;margin:10px 0 6px">Tick <strong>No class</strong> for breaks. Class weeks are numbered in order and breaks are labeled "Break". You can rename any week later.</p>
      <div class="table-wrap"><table id="bulk-preview"></table></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button type="button" id="b-create">Create weeks</button><span class="error" id="bulk-msg" style="margin:0"></span></div>
    </details>
  </div>
</template>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, SCRIPT_URL } from "./config.js";

const $ = (sel, root = document) => root.querySelector(sel);
const SCHOOL_DOMAIN = "trevor.org";
// The Apps Script version this page was built for (SCRIPT_VERSION in apps_script.gs).
const EXPECTED_SCRIPT_VERSION = 1;
const SCRIPT_FILE_URL = "https://github.com/JackRPapalia/APWhourlogging/blob/main/apps_script.gs";
let scriptVersion = null; // from the latest response; 0 means a script from before versions existed
const app = $("#app");
let me = null;
let view = "student";

// ---------- saved data ----------
// The last data the server sent is kept in this browser, so returning visitors see their
// page right away while fresh data loads in the background.
let last = null;   // latest "me" response: { user, weeks, entries, overview? }
let dirty = false; // someone typed since the last render; a background refresh mustn't wipe it
const savedKey = email => `apw:v1:${email}`;
function loadSaved(email) {
  try { return fixWeeks(JSON.parse(localStorage.getItem(savedKey(email)))); } catch { return null; }
}
function remember(patch) {
  if (!last) return;
  Object.assign(last, patch);
  try { localStorage.setItem(savedKey(last.user.email), JSON.stringify(last)); } catch { /* storage full or blocked */ }
}
function forget() {
  last = null;
  try { Object.keys(localStorage).filter(k => k.startsWith("apw:")).forEach(k => localStorage.removeItem(k)); } catch { /* blocked */ }
}
const syncing = on => $("#sync").classList.toggle("hidden", !on);
app.addEventListener("input", () => { dirty = true; });
// Browsers change a focused number box when you scroll over it, which makes the page hard
// to scroll. Unfocus the box instead, so the wheel scrolls the page and the value stays put.
document.addEventListener("wheel", e => {
  if (e.target instanceof HTMLInputElement && e.target.type === "number" && e.target === document.activeElement) e.target.blur();
}, { passive: true });

if (firebaseConfig.apiKey.startsWith("PASTE")) {
  app.innerHTML = `<div class="card auth"><h2>Almost there</h2><p class="muted">Paste your Firebase web config into <code>config.js</code> to turn on login. See the README for the steps.</p></div>`;
  throw new Error("Firebase config missing");
}
const auth = getAuth(initializeApp(firebaseConfig));

// ---------- helpers ----------
// Calls the Apps Script backend with the signed-in user's Firebase ID token.
// The body is sent as text/plain so the browser doesn't need a CORS preflight.
async function api(action, data = {}) {
  const user = auth.currentUser;
  if (!user) throw new Error("Please log in");
  const idToken = await user.getIdToken();
  // Give up after 45 s so a stuck request can't leave the page loading forever.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  let out;
  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ ...data, action, idToken }), signal: controller.signal });
    out = await res.json();
  } catch (ex) {
    throw new Error(ex.name === "AbortError"
      ? "The server took too long to respond. Try again."
      : "Couldn't reach the server. Check your connection and try again.");
  } finally {
    clearTimeout(timer);
  }
  scriptVersion = Number(out.version) || 0;
  versionBanner();
  if (out.error) throw new Error(out.error);
  return fixWeeks(out);
}

// Dates typed into the sheet by hand may lack leading zeros ("2026-10-4") or use
// month/day/year; normalize them so they sort and compare correctly as text.
// Tells admins when the deployed Apps Script is older than this page (or, rarely, newer:
// then the browser is showing an old copy of the page). Students can't fix it, so they don't see it.
function versionBanner() {
  const el = $("#script-warning");
  const show = me?.is_admin && scriptVersion !== null && scriptVersion !== EXPECTED_SCRIPT_VERSION;
  el.classList.toggle("hidden", !show);
  if (!show) return;
  el.innerHTML = scriptVersion > EXPECTED_SCRIPT_VERSION
    ? `<strong>This page is out of date.</strong> Press ⌘⇧R (or Ctrl+Shift+R) to load the latest version.`
    : `<strong>The Apps Script needs updating.</strong> Some features won't work until it's redeployed
       (deployed version: ${scriptVersion || "older than 1"}, this site expects ${EXPECTED_SCRIPT_VERSION}).
       <ol>
         <li>Open the spreadsheet, then <b>Extensions → Apps Script</b>.</li>
         <li>Replace all the code with the latest <a href="${SCRIPT_FILE_URL}" target="_blank" rel="noopener">apps_script.gs</a>, then save.</li>
         <li><b>Deploy → Manage deployments</b>, click the pencil icon, choose <b>New version</b>, then <b>Deploy</b>.</li>
       </ol>`;
}

function fixDate(v) {
  const s = String(v ?? "").trim(), pad = n => String(n).padStart(2, "0");
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;
  return s;
}
function fixWeeks(data) {
  const fix = weeks => weeks.map(w => ({ ...w, start: fixDate(w.start), end: fixDate(w.end) })).sort((a, b) => a.start.localeCompare(b.start));
  if (data?.weeks) data.weeks = fix(data.weeks);
  if (data?.overview?.weeks) data.overview.weeks = fix(data.overview.weeks);
  return data;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDay(d); };
const today = () => isoDay(new Date());
const fmt = (s, opts) => parseDay(s).toLocaleDateString(undefined, opts);
const short = s => fmt(s, { month: "short", day: "numeric" });
const range = w => `${short(w.start)} – ${fmt(w.end, { month: "short", day: "numeric", year: "numeric" })}`;
const weekName = w => w.label || `Week of ${short(w.start)}`;
const hrs = n => (Math.round(n * 100) / 100).toString();
// Hours are stored as decimals (1.33); the forms use separate hours and minutes boxes.
function splitHM(decimal) {
  const total = Math.round((Number(decimal) || 0) * 60);
  return { h: Math.floor(total / 60), m: total % 60 };
}
// Hours + minutes boxes for a form; `value` is decimal hours or empty.
function hmInputs(id, value, label = "Time spent") {
  const { h, m } = value ? splitHM(value) : { h: "", m: "" };
  return `<fieldset class="hm-field" style="border:0;margin:0;padding:0;min-width:0">
    <legend style="font-size:13px;color:var(--muted);margin-bottom:4px;padding:0">${label}</legend>
    <div class="hm">
      <input id="${id}-h" name="h" type="number" min="0" max="100" step="1" inputmode="numeric" value="${h}" aria-label="Hours" placeholder="0"><span>hours</span>
      <input id="${id}-m" name="m" type="number" min="0" max="59" step="1" inputmode="numeric" value="${m}" aria-label="Minutes" placeholder="0"><span>min</span>
    </div>
  </fieldset>`;
}
// Decimal hours from a form's hours/minutes boxes, or an Error explaining what's wrong.
function readHM(form) {
  const h = form.h.value.trim() === "" ? 0 : Number(form.h.value), m = form.m.value.trim() === "" ? 0 : Number(form.m.value);
  if (!Number.isInteger(h) || h < 0) return new Error("Hours must be a whole number");
  if (!Number.isInteger(m) || m < 0 || m > 59) return new Error("Minutes must be a whole number from 0 to 59");
  if (h === 0 && m === 0) return new Error("Enter the hours and/or minutes you spent");
  return h + m / 60;
}
const stat = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
// "5 min ago", "yesterday", "Oct 3" — for last sign-in times (ms since 1970).
function ago(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 2) return "just now";
  if (min < 60) return `${min} min ago`;
  if (min < 60 * 24) return `${Math.round(min / 60)} h ago`;
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(ms).setHours(0, 0, 0, 0)) / 864e5);
  if (days <= 1) return "yesterday";
  if (days < 7) return `${days} days ago`;
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: new Date(ms).getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
}
const exactTime = ms => new Date(ms).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
// Last sign-in for a person: relative time with the exact time on hover.
function lastSeen(p) {
  if (p.last_login) return `<span title="${esc(exactTime(p.last_login))}">${ago(p.last_login)}</span>`;
  return p.signed_in ? '<span class="muted" title="Signed in before sign-in times were recorded">earlier</span>' : '<span class="muted">never</span>';
}
const started = w => w.start <= today();
// A week is closed to students once its due date (end + grace days) has passed. Admins can always edit.
const isClosed = w => !!w.due && today() > w.due;
const closedForMe = w => isClosed(w) && !me?.is_admin;
const dueText = w => w.due ? fmt(w.due, { weekday: "short", month: "short", day: "numeric" }) : "";

// Bar chart of one value per week, drawn as inline SVG at the container's width.
// One series: no legend; the selected week is emphasized and direct-labeled; every bar has a
// hover/focus tooltip on a hit area wider than the bar.
function drawWeekChart(el, weeks, valueOf, { selected, tooltip, onPick } = {}) {
  const shown = weeks.filter(started);
  if (!shown.length) { el.innerHTML = `<p class="muted" style="font-size:13px;margin:0">No weeks have started yet.</p>`; return; }
  const W = Math.max(280, el.clientWidth || 600), H = 150, left = 30, right = 4, top = 18, bottom = 22;
  const vals = shown.map(valueOf);
  const peak = Math.max(...vals, 1);
  const mag = 10 ** Math.floor(Math.log10(peak));
  const max = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= peak);
  const plotW = W - left - right, plotH = H - top - bottom, slot = plotW / shown.length;
  const bw = Math.max(3, Math.min(32, slot * 0.6));
  const y = v => top + plotH - (v / max) * plotH;
  const every = Math.ceil(shown.length / Math.max(1, Math.floor(plotW / 56))); // thin out x labels
  const grid = [0, max / 2, max].map(v => `
    <line class="grid" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"></line>
    <text class="tick" x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${hrs(v)}</text>`).join("");
  const bars = shown.map((w, i) => {
    const v = vals[i], x = left + i * slot + (slot - bw) / 2, yTop = y(v), base = y(0), r = Math.min(4, bw / 2, base - yTop);
    const path = v > 0
      ? `M${x},${base}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + bw - r}Q${x + bw},${yTop} ${x + bw},${yTop + r}V${base}Z`
      : "";
    const sel = selected == null || w.id === selected;
    const tip = tooltip ? tooltip(w, v) : `${weekName(w)}: ${hrs(v)} h`;
    return `<g>
      <rect class="hit" x="${left + i * slot}" y="${top}" width="${slot}" height="${plotH}" data-week="${w.id}" tabindex="0" aria-label="${esc(tip)}"><title>${esc(tip)}</title></rect>
      ${path ? `<path class="bar ${sel ? "" : "dim"}" d="${path}" pointer-events="none"></path>` : ""}
      ${w.id === selected && v > 0 ? `<text class="value" x="${x + bw / 2}" y="${yTop - 5}" text-anchor="middle">${hrs(v)}</text>` : ""}
      ${i % every === 0 ? `<text class="tick" x="${left + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle">${esc(w.label || short(w.start))}</text>` : ""}
    </g>`;
  }).join("");
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Hours per week">${grid}${bars}</svg>`;
  if (onPick) el.onclick = e => { const id = e.target.dataset?.week; if (id) onPick(Number(id)); };
}
const isCurrent = w => w.start <= today() && today() <= w.end;
// The week happening now, or else the most recent one that has started, or else the first.
const defaultWeek = weeks => (weeks.find(isCurrent) || weeks.filter(started).at(-1) || weeks[0])?.id;
// The Apps Script can take several seconds to wake up after a quiet spell, so say so if loading drags on.
function loading() {
  app.innerHTML = `<p class="loading">Loading…<br><span class="slow hidden" style="font-size:13px">Still working. The server can take a few seconds to wake up.</span></p>`;
  const hint = $(".slow", app);
  setTimeout(() => hint.classList.remove("hidden"), 5000);
}
function fatal(msg) {
  app.innerHTML = `<div class="card"><p class="error" style="margin:0 0 12px">${esc(msg)}</p>
    <button class="small" id="retry">Try again</button>
    ${auth.currentUser ? `<button class="ghost small" id="switch">Use a different account</button>` : ""}</div>`;
  $("#retry").onclick = () => location.reload();
  if (auth.currentUser) $("#switch").onclick = () => signOut(auth);
}

// Runs fn while a button shows a busy label, so slow sheet calls don't look frozen.
async function busy(button, label, fn) {
  const old = button.textContent;
  button.disabled = true;
  button.textContent = label;
  try { return await fn(); } finally { button.disabled = false; button.textContent = old; }
}

function authMessage(ex) {
  const messages = {
    "auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
    "auth/popup-blocked": "Your browser blocked the Google sign-in window. Allow popups for this site and try again.",
    "auth/popup-closed-by-user": "",
    "auth/cancelled-popup-request": "",
    "auth/operation-not-allowed": "That sign-in method isn't turned on in Firebase yet.",
    "auth/unauthorized-domain": "This website isn't on Firebase's list of authorized domains yet.",
  };
  return ex.code in messages ? messages[ex.code] : ex.message;
}

// ---------- top-level ----------
function render(data = last) {
  dirty = false;
  versionBanner();
  $("#topbar").classList.toggle("hidden", !me);
  if (!me) return renderAuth();
  $("#who").textContent = `${me.name} (${me.email})${me.section && !me.is_admin ? ` · ${me.section}` : ""}`;
  const nav = $("#nav");
  nav.innerHTML = me.is_admin
    ? `<button class="ghost small ${view === "student" ? "active" : ""}" data-view="student">My hours</button>
       <button class="ghost small ${view === "admin" ? "active" : ""}" data-view="admin">Admin panel</button>`
    : "";
  nav.onclick = e => { const v = e.target.dataset.view; if (v) { view = v; render(); } };
  const page = view === "admin" && me.is_admin ? renderAdmin(data?.overview) : renderStudent(data);
  page.catch(ex => fatal(ex.message));
}

$("#logout").onclick = () => { forget(); signOut(auth); };

onAuthStateChanged(auth, async user => {
  if (!user) { me = null; last = null; view = "student"; return render(); }
  // Show what we had last time straight away, then refresh it.
  const saved = loadSaved(user.email.toLowerCase());
  if (saved?.user) {
    last = saved;
    me = saved.user;
    view = me.is_admin ? "admin" : "student";
    render(saved);
    syncing(true);
  } else {
    loading();
  }
  try {
    const data = await api("me", { name: user.displayName || "", withOverview: true });
    const changed = JSON.stringify(data) !== JSON.stringify(saved);
    last = data;
    remember({});
    me = data.user;
    if (!me.is_admin) view = "student";
    if (!saved) view = me.is_admin ? "admin" : "student";
    if (!saved || (changed && !dirty)) render(data);
  } catch (ex) {
    // Keep saved data for connection problems; anything else (e.g. removed from the class list) clears it.
    if (!/reach the server|too long/.test(ex.message)) forget();
    fatal(ex.message);
  } finally {
    syncing(false);
  }
});

// ---------- auth ----------
function renderAuth() {
  app.replaceChildren($("#tpl-auth").content.cloneNode(true));
  const err = $("#auth-error");
  // `hd` makes Google's account picker show @trevor.org accounts first; it's only a hint,
  // so people on another domain (e.g. a staff address) use the second button.
  const signIn = (button, params) => async () => {
    err.textContent = "";
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account", ...params });
    try { await busy(button, "Signing in…", () => signInWithPopup(auth, provider)); }
    catch (ex) { err.textContent = authMessage(ex); }
  };
  $("#google").onclick = signIn($("#google"), { hd: SCHOOL_DOMAIN });
  $("#google-other").onclick = signIn($("#google-other"), {});
}

// ---------- student ----------
async function renderStudent(data) {
  if (!data) { loading(); data = await api("me"); }
  app.replaceChildren($("#tpl-student").content.cloneNode(true));
  const { weeks } = data;
  let { entries } = data;
  const open = weeks.filter(started).reverse();

  const cur = weeks.find(isCurrent);
  const total = Object.values(entries).reduce((s, e) => s + e.hours, 0);
  $("#my-stats").innerHTML =
    stat(cur ? hrs(entries[cur.id]?.hours || 0) : "–", cur ? `Hours this week (${esc(weekName(cur))})` : "No week in progress") +
    stat(hrs(total), "Total hours") +
    // No-class weeks and weeks you're excused from don't count toward "weeks logged".
    stat(`${open.filter(w => entries[w.id]?.hours > 0).length}/${open.filter(w => !w.no_class && !entries[w.id]?.excused).length}`, "Weeks logged");

  drawWeekChart($("#my-chart"), weeks, w => entries[w.id]?.hours || 0, {
    selected: cur?.id,
    tooltip: (w, v) => w.no_class && !v ? `${weekName(w)}: no class` : entries[w.id]?.excused ? `${weekName(w)}: excused` : `${weekName(w)}: ${hrs(v)} h`,
  });

  const list = $("#my-weeks");
  if (!open.length) {
    list.innerHTML = `<p class="muted">${weeks.length ? `The first week starts ${range(weeks[0])}.` : "Your teacher hasn't set up any weeks yet."}</p>`;
    return;
  }
  list.innerHTML = open.map(w => {
    const e = entries[w.id];
    const head = `
      <div class="week-head">
        <strong>${esc(weekName(w))}${isCurrent(w) ? '<span class="badge">this week</span>' : ""}${w.no_class ? '<span class="badge">no class</span>' : ""}${e?.excused ? '<span class="badge">excused</span>' : ""}${closedForMe(w) ? '<span class="badge warn">closed</span>' : ""}</strong>
        <span class="muted" style="font-size:13px">${range(w)}${w.due && !closedForMe(w) && !w.no_class ? ` · due ${dueText(w)}` : ""}</span>
      </div>`;
    const excuseNote = e?.excused ? `<p class="excused" style="margin:0 0 10px;font-size:14px">Your teacher excused you from this week${e.description ? ` (${esc(e.description)})` : ""}.${closedForMe(w) ? "" : " If you did some work anyway, you can still log it."}</p>` : "";
    if (w.no_class && !e) {
      return `<div class="week">${head}<p class="muted" style="margin:0;font-size:14px">No class this week, so there's nothing to log.</p></div>`;
    }
    if (closedForMe(w) || (w.no_class && !me?.is_admin)) {
      return `<div class="week">${head}
        ${e?.excused ? excuseNote
          : e ? `<div class="closed-entry"><strong>${hrs(e.hours)} h</strong><div class="desc">${esc(e.description)}</div></div>`
          : `<p class="muted" style="margin:0;font-size:14px">Not logged. This week closed on ${dueText(w)}; ask your teacher if you need to add hours.</p>`}
      </div>`;
    }
    const logged = e && !e.excused ? e : null; // an excuse isn't hours to edit
    return `
    <form class="week" data-week="${w.id}">${head}${excuseNote}
      <div class="week-form">
        ${hmInputs(`t-${w.id}`, logged?.hours, "Total time this week")}
        <div><label for="d-${w.id}">What did you work on?</label><textarea id="d-${w.id}" name="description" maxlength="2000" rows="2" required>${logged ? esc(logged.description) : ""}</textarea></div>
        <div class="actions">
          <button type="submit" class="small">${logged ? "Update" : "Save"}</button>
          ${logged ? `<button type="button" class="danger small" data-clear>Clear</button>` : ""}
          <span class="status ${logged ? "ok" : "muted"}">${logged ? "Saved" : e?.excused ? "Excused" : "Not logged yet"}</span>
        </div>
      </div>
    </form>`;
  }).join("");

  const reload = async result => {
    remember({ entries: result.entries });
    await renderStudent({ ...data, weeks, entries: result.entries });
  };
  list.onsubmit = async ev => {
    ev.preventDefault();
    const form = ev.target, status = $(".status", form);
    try {
      const hours = readHM(form);
      if (hours instanceof Error) throw hours;
      const result = await busy(form.querySelector("button[type=submit]"), "Saving…", () =>
        api("saveEntry", { week_id: Number(form.dataset.week), hours, description: form.description.value }));
      await reload(result);
    } catch (ex) { status.className = "status error"; status.style.margin = 0; status.textContent = ex.message; }
  };
  list.onclick = async ev => {
    if (!ev.target.matches("[data-clear]")) return;
    const form = ev.target.closest("form");
    if (!confirm("Clear your hours for this week?")) return;
    try {
      await reload(await busy(ev.target, "Clearing…", () => api("deleteEntry", { week_id: Number(form.dataset.week) })));
    } catch (ex) { $(".status", form).textContent = ex.message; }
  };
}

// ---------- admin ----------
let adminWeek = null;
let adminSort = "name";
let adminSection = "";

// `prefetched` is the overview that came with the sign-in response, when there is one.
async function renderAdmin(prefetched) {
  if (!prefetched) loading();
  const overview = prefetched || await api("overview");
  remember({ overview, weeks: overview.weeks });
  const { weeks, students: people } = overview;
  const sections = overview.sections || ["Section 1", "Section 2"];
  const students = people.filter(s => s.section); // admins without a section don't log hours
  app.replaceChildren($("#tpl-admin").content.cloneNode(true));
  if (!weeks.some(w => w.id === adminWeek)) adminWeek = defaultWeek(weeks);
  if (adminSection && !sections.includes(adminSection)) adminSection = "";
  $("#sort").value = adminSort;
  $("#section").innerHTML = `<option value="">All sections</option>` + sections.map(n => `<option ${n === adminSection ? "selected" : ""}>${esc(n)}</option>`).join("");

  function draw() {
    const sel = $("#wk-select");
    sel.innerHTML = weeks.length
      ? weeks.map(w => `<option value="${w.id}" ${w.id === adminWeek ? "selected" : ""}>${esc(weekName(w))} (${range(w)})</option>`).join("")
      : `<option>No weeks set up yet</option>`;
    sel.disabled = !weeks.length;

    const shown = students.filter(s => !adminSection || s.section === adminSection);
    const wkHours = s => s.hours[adminWeek] || 0;
    const sorted = [...shown].sort((a, b) =>
      adminSort === "week" ? wkHours(b) - wkHours(a) :
      adminSort === "total" ? b.total - a.total :
      adminSort === "login" ? (b.last_login || 0) - (a.last_login || 0) :
      a.name.localeCompare(b.name));
    const selWeek = weeks.find(w => w.id === adminWeek);
    const expected = selWeek?.no_class ? [] : shown.filter(s => !s.entries?.[adminWeek]?.excused);
    const logged = expected.filter(s => wkHours(s) > 0).length;
    const weekTotal = shown.reduce((t, s) => t + wkHours(s), 0);
    $("#class-stats").innerHTML =
      stat(shown.length, "Students") +
      stat(selWeek?.no_class ? "no class" : `${logged}/${expected.length}`, "Logged this week") +
      stat(hrs(weekTotal), "Class hours this week") +
      stat(logged ? hrs(weekTotal / logged) : "0", "Average per student who logged");

    $("#overview").innerHTML = `
      <thead><tr><th>Student</th>${adminSection ? "" : "<th>Section</th>"}<th>Last sign-in</th>
        ${weeks.map(w => `<th class="num ${w.id === adminWeek ? "current" : ""}">${esc(w.label || short(w.start))}${w.no_class ? '<span class="sub noclass">no class</span>' : w.label ? `<span class="sub">${short(w.start)}</span>` : ""}</th>`).join("")}
        <th class="num">Total</th></tr></thead>
      <tbody>${sorted.map(s => `
        <tr class="clickable" data-user="${esc(s.email)}">
          <td>${s.signed_in ? esc(s.name) + " " : ""}<span class="muted">${esc(s.email)}</span></td>
          ${adminSection ? "" : `<td>${esc(s.section)}</td>`}
          <td>${lastSeen(s)}</td>
          ${weeks.map(w => {
            const v = s.hours[w.id] || 0, e = s.entries?.[w.id], cls = `num ${w.id === adminWeek ? "current" : ""}`;
            if (e?.excused) return `<td class="${cls} excused" title="Excused${e.description ? ": " + esc(e.description) : ""}">ex</td>`;
            if (!v && w.no_class) return `<td class="${cls} noclass-cell" title="No class">·</td>`;
            return `<td class="${cls} ${v ? "" : "zero"}">${v ? hrs(v) : "–"}${e?.late ? '<span class="late" title="Logged after the week ended" aria-label="logged late"> •</span>' : ""}</td>`;
          }).join("")}
          <td class="num"><strong>${hrs(s.total)}</strong></td>
        </tr>`).join("") || `<tr><td colspan="${weeks.length + 4}" class="muted">No students yet. Add them in the class list below.</td></tr>`}
      </tbody>`;

    const sum = w => shown.reduce((t, s) => t + (s.hours[w.id] || 0), 0);
    const count = w => shown.filter(s => s.hours[w.id] > 0).length;
    $("#chart-scope").textContent = adminSection ? `· ${adminSection}` : "· all sections";
    drawWeekChart($("#class-chart"), weeks, sum, {
      selected: adminWeek,
      tooltip: (w, v) => w.no_class && !v ? `${weekName(w)}: no class` : `${weekName(w)}: ${hrs(v)} h from ${count(w)} of ${shown.length} students`,
      onPick: id => { adminWeek = id; draw(); },
    });
    drawMissing(weeks.find(w => w.id === adminWeek), shown);
  }

  $("#wk-select").onchange = e => { adminWeek = Number(e.target.value); draw(); };
  $("#section").onchange = e => { adminSection = e.target.value; draw(); };
  $("#sort").onchange = e => { adminSort = e.target.value; draw(); };
  $("#overview").onclick = e => { const tr = e.target.closest("tr[data-user]"); if (tr) showStudent(tr.dataset.user).catch(ex => alert(ex.message)); };
  $("#detail-close").onclick = () => $("#detail").classList.add("hidden");
  $("#add-people").onclick = () => {
    $("#class-list").scrollIntoView({ behavior: "smooth", block: "start" });
    $("#r-emails").focus({ preventScroll: true });
  };
  $("#export").onclick = () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const rows = students.filter(s => !adminSection || s.section === adminSection);
    const stamp = ms => { const d = new Date(ms); return `${isoDay(d)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
    const lines = [["Name", "Email", "Section", "Last sign-in", ...weeks.map(w => `${weekName(w)} (${w.start} to ${w.end})`), "Total"].map(q).join(",")];
    for (const s of rows) lines.push([s.signed_in ? s.name : "", s.email, s.section, s.last_login ? stamp(s.last_login) : (s.signed_in ? "" : "never"), ...weeks.map(w => s.hours[w.id] || 0), s.total].map(q).join(","));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = `apw-hours-${adminSection ? adminSection.replace(/\s+/g, "-").toLowerCase() + "-" : ""}${today()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  draw();
  setupDeadline(overview.settings);
  setupClassList(people, sections);
  setupWeekEditor(weeks);
}

// Students in view with no hours for the selected week, with quick ways to remind them.
function drawMissing(week, shown) {
  const box = $("#missing");
  if (!week || !started(week)) { box.innerHTML = ""; return; }
  if (!shown.length) { box.innerHTML = ""; return; }
  if (week.no_class) { box.innerHTML = `<span class="muted">${esc(weekName(week))} is a no-class week, so no hours are expected.</span>`; return; }
  const missing = shown.filter(s => !(s.hours[week.id] > 0) && !s.entries?.[week.id]?.excused);
  if (!missing.length) {
    box.innerHTML = `<span class="ok">Everyone shown has logged hours for ${esc(weekName(week))}.</span>`;
    return;
  }
  const emails = missing.map(s => s.email);
  const site = location.origin + location.pathname;
  const subject = `Log your hours for ${weekName(week)}`;
  const body = `Hi,\n\nYou haven't logged your hours for ${weekName(week)} (${range(week)}) yet.` +
    ` Please log them at ${site}${week.due && !isClosed(week) ? ` by ${dueText(week)}` : ""}.\n\nThanks!`;
  box.innerHTML = `
    <strong>${missing.length} of ${shown.length} haven't logged hours for ${esc(weekName(week))}</strong>${week.due ? ` <span class="muted">· ${isClosed(week) ? "closed" : "due"} ${dueText(week)}</span>` : ""}
    <div class="who">${missing.map(s => esc(s.signed_in ? s.name : s.email)).join(", ")}</div>
    <a class="button small" href="mailto:?bcc=${encodeURIComponent(emails.join(","))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">Email them</a>
    <button class="ghost small" id="copy-missing">Copy emails</button>
    <span class="muted" id="copy-msg" style="font-size:13px"></span>`;
  $("#copy-missing").onclick = async () => {
    try { await navigator.clipboard.writeText(emails.join(", ")); $("#copy-msg").textContent = "Copied."; }
    catch { $("#copy-msg").textContent = emails.join(", "); }
  };
}

// The "students can change a week until…" setting. Hidden if the script is too old to have it.
function setupDeadline(settings) {
  if (!settings) return;
  $("#deadline-row").classList.remove("hidden");
  const sel = $("#grace"), msg = $("#deadline-msg");
  const current = settings.grace_days === null ? "none" : String(settings.grace_days);
  if (![...sel.options].some(o => o.value === current)) sel.add(new Option(`${current} days after it ends`, current));
  sel.value = current;
  sel.onchange = async () => {
    msg.className = "muted";
    msg.textContent = "Saving…";
    try {
      const r = await api("saveSettings", { grace_days: sel.value === "none" ? "none" : Number(sel.value) });
      await renderAdmin(r.overview);
      $("#deadline-msg").textContent = "Saved.";
    } catch (ex) { msg.className = "error"; msg.textContent = ex.message; sel.value = current; }
  };
}

function setupClassList(people, sections) {
  const msg = $("#roster-msg");
  const groups = [{ key: "admin", title: "Admins", members: people.filter(p => p.is_admin) },
    ...sections.map(n => ({ key: n, title: n, members: people.filter(p => p.section === n) }))];
  // Sections first so a pasted class list doesn't land in Admins by default.
  $("#r-group").innerHTML = [...groups.slice(1), groups[0]].map(g => `<option value="${esc(g.key)}">${g.key === "admin" ? "Admin" : esc(g.title)}</option>`).join("");
  $("#roster-lists").innerHTML = groups.map(g => `
    <div>
      <h3>${esc(g.title)} <span class="muted" style="font-weight:400">(${g.members.length})</span></h3>
      <ul>${g.members.sort((a, b) => a.email.localeCompare(b.email)).map(p => `
        <li><span title="${esc(p.email)}">${esc(p.email)} <small class="muted">· ${lastSeen(p)}</small></span>
          ${g.key === "admin" && p.email === me.email ? '<span class="muted" style="font-size:12px">you</span>'
            : `<button class="danger small" data-remove="${esc(p.email)}" data-group="${esc(g.key)}" aria-label="Remove ${esc(p.email)}">Remove</button>`}</li>`).join("")
        || '<li><span class="muted">Nobody yet</span></li>'}</ul>
    </div>`).join("");

  const list = (label, emails) => emails.length ? `${label}: ${emails.join(", ")}` : "";
  $("#roster-form").onsubmit = async e => {
    e.preventDefault();
    msg.className = "error";
    msg.textContent = "";
    const group = $("#r-group").value;
    try {
      const r = await busy($("#r-submit"), "Adding…", () => api("addUsers", { emails: $("#r-emails").value, group }));
      await renderAdmin(r.overview);
      const done = $("#roster-msg");
      done.className = "error ok";
      done.textContent = [list("Added", r.added), list("Moved from the other section", r.moved), list("Already there", r.already)].filter(Boolean).join(". ");
      $("#roster-msg").scrollIntoView({ block: "center" });
    } catch (ex) { msg.textContent = ex.message; }
  };
  $("#roster-lists").onclick = async e => {
    const email = e.target.dataset.remove, group = e.target.dataset.group;
    if (!email) return;
    const where = group === "admin" ? "Admins" : group;
    if (!confirm(`Remove ${email} from ${where}?${group === "admin" ? "" : " They won't be able to sign in unless they're on another list. Their logged hours stay in the sheet."}`)) return;
    try {
      const r = await busy(e.target, "Removing…", () => api("removeUser", { email, group }));
      await renderAdmin(r.overview);
    } catch (ex) { msg.className = "error"; msg.textContent = ex.message; }
  };
}

function setupWeekEditor(weeks) {
  const form = $("#week-editor"), err = $("#week-error");
  let editing = null;
  // Weeks added in the app can't overlap, but ones typed into the sheet can.
  const overlaps = w => weeks.filter(o => o.id !== w.id && o.start <= w.end && o.end >= w.start);

  $("#weeks-table").innerHTML = weeks.length ? `
    <thead><tr><th>Week</th><th>Start</th><th>End</th><th>Students can edit until</th><th></th></tr></thead>
    <tbody>${[...weeks].reverse().map(w => `
      <tr>
        <td>${esc(weekName(w))}${isCurrent(w) ? '<span class="badge">current</span>' : ""}${w.no_class ? '<span class="badge">no class</span>' : ""}${overlaps(w).map(o => `<span class="badge warn">overlaps ${esc(weekName(o))}</span>`).join("")}</td>
        <td>${fmt(w.start, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</td>
        <td>${fmt(w.end, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</td>
        <td>${w.due ? `${dueText(w)}${isClosed(w) ? ' <span class="muted">(closed)</span>' : ""}` : '<span class="muted">no deadline</span>'}</td>
        <td class="num"><button class="ghost small" data-edit="${w.id}">Edit</button> <button class="danger small" data-delete="${w.id}">Delete</button></td>
      </tr>`).join("")}
    </tbody>` : `<tbody><tr><td class="muted">No weeks yet. Add the first one below.</td></tr></tbody>`;

  function reset() {
    editing = null;
    const lastEnd = weeks.map(w => w.end).sort().at(-1);
    const start = lastEnd ? addDays(lastEnd, 1) : today();
    $("#w-label").value = "";
    $("#w-noclass").checked = false;
    $("#w-start").value = start;
    $("#w-end").value = addDays(start, 6);
    $("#w-submit").textContent = "Add week";
    $("#w-cancel").classList.add("hidden");
    err.textContent = "";
  }
  reset();
  if (weeks.some(w => overlaps(w).length)) {
    err.textContent = "Some weeks share days. Edit them so each week ends the day before the next one starts (e.g. Sunday to Saturday).";
  }

  $("#w-start").onchange = () => { if (!editing && $("#w-start").value) $("#w-end").value = addDays($("#w-start").value, 6); };
  $("#w-cancel").onclick = reset;
  $("#weeks-table").onclick = async e => {
    const editId = Number(e.target.dataset.edit), delId = Number(e.target.dataset.delete);
    if (editId) {
      editing = weeks.find(w => w.id === editId);
      $("#w-label").value = editing.label;
      $("#w-noclass").checked = !!editing.no_class;
      $("#w-start").value = editing.start;
      $("#w-end").value = editing.end;
      $("#w-submit").textContent = "Save changes";
      $("#w-cancel").classList.remove("hidden");
      $("#w-label").focus();
    }
    if (delId) {
      const w = weeks.find(w => w.id === delId);
      if (!confirm(`Delete ${weekName(w)}? Hours students logged for it stay in the sheet but won't show here.`)) return;
      try {
        const r = await busy(e.target, "Deleting…", () => api("deleteWeek", { id: delId }));
        renderAdmin(r.overview).catch(ex => fatal(ex.message));
      } catch (ex) { err.textContent = ex.message; }
    }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = "";
    const body = { id: editing?.id, label: $("#w-label").value, start: $("#w-start").value, end: $("#w-end").value, no_class: $("#w-noclass").checked };
    try {
      const r = await busy($("#w-submit"), "Saving…", () => api("saveWeek", body));
      renderAdmin(r.overview).catch(ex => fatal(ex.message));
    } catch (ex) { err.textContent = ex.message; }
  };
  setupBulkWeeks(weeks);
}

// "Set up several weeks at once": a live preview of consecutive weeks, with breaks ticked off.
function setupBulkWeeks(weeks) {
  const msg = $("#bulk-msg");
  const lastEnd = weeks.map(w => w.end).sort().at(-1);
  const numbered = weeks.map(w => Number((/^week\s+(\d+)$/i.exec(w.label) || [])[1])).filter(Boolean);
  $("#b-start").value = lastEnd ? addDays(lastEnd, 1) : today();
  $("#b-num").value = numbered.length ? Math.max(...numbered) + 1 : 1;
  const breaks = new Set(); // positions in the preview ticked "No class"

  function planned() {
    const first = $("#b-start").value, len = Number($("#b-len").value);
    const count = Math.min(60, Math.max(0, Math.round(Number($("#b-count").value) || 0)));
    if (!first || !count) return [];
    let num = Math.max(1, Math.round(Number($("#b-num").value) || 1));
    return Array.from({ length: count }, (_, i) => {
      const start = addDays(first, i * (len === 5 ? 7 : len)); // 5-day weeks still start a week apart
      const no_class = breaks.has(i);
      return { start, end: addDays(start, len - 1), no_class, label: no_class ? "Break" : `Week ${num++}` };
    });
  }

  function preview() {
    const list = planned();
    $("#bulk-preview").innerHTML = list.length ? `
      <thead><tr><th>No class</th><th>Week</th><th>Dates</th></tr></thead>
      <tbody>${list.map((w, i) => {
        const clash = weeks.find(o => o.start <= w.end && o.end >= w.start);
        return `<tr>
          <td><input type="checkbox" data-break="${i}" ${w.no_class ? "checked" : ""} aria-label="No class in week starting ${esc(w.start)}"></td>
          <td>${esc(w.label)}${clash ? `<span class="badge warn">overlaps ${esc(weekName(clash))}</span>` : ""}</td>
          <td>${fmt(w.start, { weekday: "short", month: "short", day: "numeric" })} – ${fmt(w.end, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</td>
        </tr>`;
      }).join("")}</tbody>` : "";
    $("#b-create").textContent = list.length ? `Create ${list.length} week${list.length === 1 ? "" : "s"}` : "Create weeks";
    $("#b-create").disabled = !list.length;
  }

  ["#b-start", "#b-count", "#b-len", "#b-num"].forEach(sel => { $(sel).oninput = () => { msg.textContent = ""; preview(); }; });
  $("#bulk-preview").onchange = e => {
    const i = Number(e.target.dataset.break);
    if (e.target.checked) breaks.add(i); else breaks.delete(i);
    preview();
  };
  $("#b-create").onclick = async () => {
    msg.textContent = "";
    try {
      const r = await busy($("#b-create"), "Creating…", () => api("addWeeks", { weeks: planned() }));
      await renderAdmin(r.overview);
    } catch (ex) { msg.textContent = ex.message; }
  };
  preview();
}

async function showStudent(email) {
  const panel = $("#detail");
  panel.classList.remove("hidden");
  $("#detail-title").textContent = "Loading…";
  $("#detail-actions").innerHTML = "";
  $("#detail-weeks").innerHTML = "";
  // The overview already carries each student's weekly notes; older script versions don't.
  const local = last?.overview?.students?.find(s => s.email === email && s.entries);
  const { user, weeks, entries } = local
    ? { user: local, weeks: last.overview.weeks, entries: local.entries }
    : await api("userEntries", { email });
  $("#detail-title").textContent = `${user.name} — ${hrs(Object.values(entries).reduce((s, e) => s + e.hours, 0))} h total`;
  $("#detail-actions").innerHTML = `<span class="muted" style="font-size:13px">${esc(user.email)}${user.section ? ` · ${esc(user.section)}` : ""}${user.is_admin ? " · admin" : ""} · last signed in ${user.last_login ? `<span title="${esc(exactTime(user.last_login))}">${ago(user.last_login)}</span>` : (user.signed_in === false ? "never" : "before times were recorded")}</span>`;
  const shown = weeks.filter(started).reverse();
  const updatedText = e => !e.updated ? "" :
    `<div class="muted" style="font-size:12px;margin-top:4px">Updated <span title="${esc(exactTime(e.updated))}">${ago(e.updated)}</span>${e.updated_by && e.updated_by !== user.email ? ` by ${esc(e.updated_by)}` : ""}${e.late ? ' · <span class="late">logged after the week ended</span>' : ""}</div>`;
  $("#detail-weeks").innerHTML = shown.map(w => {
    const e = entries[w.id];
    return `
      <div class="week" data-week="${w.id}">
        <div class="week-head">
          <strong>${esc(weekName(w))} <span class="muted" style="font-weight:400;font-size:13px">${range(w)}</span></strong>
          <span><span class="total">${e?.excused ? '<span class="excused">excused</span>' : e ? `${hrs(e.hours)} h` : `<span class="muted">${w.no_class ? "no class" : "not logged"}</span>`}</span>
            <button class="ghost small" data-edit-entry="${w.id}">${e && !e.excused ? "Edit" : "Add"}</button>
            ${e?.excused ? `<button class="ghost small" data-unexcuse="${w.id}">Remove excuse</button>`
              : !e && !w.no_class ? `<button class="ghost small" data-excuse="${w.id}">Excuse</button>` : ""}</span>
        </div>
        ${e?.excused ? `<div class="desc excused">${e.description ? esc(e.description) : "No reason given"}</div>${updatedText(e)}`
          : e ? `<div class="desc">${esc(e.description)}</div>${updatedText(e)}` : ""}
        <div class="edit-slot"></div>
      </div>`;
  }).join("") || `<p class="muted">No weeks have started yet.</p>`;

  // Admin corrections: edit or clear any week for this student, even after it closes.
  $("#detail-weeks").onclick = async ev => {
    const excuseId = Number(ev.target.dataset.excuse), unexcuseId = Number(ev.target.dataset.unexcuse);
    const refresh = async r => { await renderAdmin(r.overview); await showStudent(email); };
    if (excuseId) {
      const reason = prompt(`Excuse ${user.name} from ${weekName(weeks.find(w => w.id === excuseId))}? Reason (optional):`, "");
      if (reason === null) return;
      try { await refresh(await busy(ev.target, "Saving…", () => api("excuseEntry", { email, week_id: excuseId, reason }))); }
      catch (ex) { alert(ex.message); }
      return;
    }
    if (unexcuseId) {
      try { await refresh(await busy(ev.target, "Removing…", () => api("deleteEntry", { email, week_id: unexcuseId }))); }
      catch (ex) { alert(ex.message); }
      return;
    }
    const editId = Number(ev.target.dataset.editEntry);
    if (editId) {
      const block = ev.target.closest(".week"), e0 = entries[editId], e = e0?.excused ? null : e0, slot = $(".edit-slot", block);
      slot.innerHTML = `
        <form class="detail-edit">
          ${hmInputs(`a-${editId}`, e?.hours, "Time")}
          <textarea name="description" rows="2" maxlength="2000" aria-label="What they worked on" required>${e ? esc(e.description) : ""}</textarea>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button type="submit" class="small">Save</button>
            ${e ? '<button type="button" class="danger small" data-clear-entry>Clear</button>' : ""}
            <button type="button" class="ghost small" data-cancel>Cancel</button>
          </div>
          <span class="error" style="grid-column:1/-1;margin:0;min-height:0"></span>
        </form>`;
      const form = $("form", slot), err = $(".error", form);
      const done = async r => { await renderAdmin(r.overview); await showStudent(email); };
      form.h.focus();
      form.onsubmit = async se => {
        se.preventDefault();
        try {
          const hours = readHM(form);
          if (hours instanceof Error) throw hours;
          await done(await busy($("button[type=submit]", form), "Saving…", () => api("saveEntry", { email, week_id: editId, hours, description: form.description.value })));
        }
        catch (ex) { err.textContent = ex.message; }
      };
      form.onclick = async ce => {
        if (ce.target.matches("[data-cancel]")) slot.innerHTML = "";
        if (ce.target.matches("[data-clear-entry]") && confirm(`Clear ${user.name}'s hours for this week?`)) {
          try { await done(await busy(ce.target, "Clearing…", () => api("deleteEntry", { email, week_id: editId }))); }
          catch (ex) { err.textContent = ex.message; }
        }
      };
    }
  };
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
